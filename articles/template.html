<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== [必改] 文章标题 ===== -->
  <title>文章标题</title>
  <!-- ===== [必改] 页面描述，用于 SEO 和社交分享（与 article-data.js 的 summary 保持一致） ===== -->
  <meta name="description" content="文章简短描述，建议 30-80 字">
  <!-- ===== [必改] 分类和日期（scan-articles.py 自动读取这些标签） ===== -->
  <meta name="category" content="分类名">
  <meta name="date" content="2026-05-22">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- ==========================================
       导航栏由 nav.js 自动生成，无需手动编写
       ========================================== -->

  <div class="main-wrapper">
    <!-- 返回首页链接 -->
    <a href="../index.html" class="back-link">&larr; 返回首页</a>

    <article class="article-detail">
      <header class="article-header">
        <!-- ===== [必改] 文章标题 ===== -->
        <h1>文章标题</h1>
        <div class="meta">
          <!-- ===== [必改] 分类和时间 ===== -->
          <span>分类：大类名称</span> &middot;
          <span>2026-05-22</span>
        </div>
      </header>

      <div class="article-body">
        <!-- ==========================================
             从此处开始写文章内容
             常用标签参考（复制后删除注释）：
             ==========================================

             段落：
             <p>文字内容</p>

             二级标题：
             <h2>标题文字</h2>

             三级标题：
             <h3>标题文字</h3>

             无序列表：
             <ul>
               <li>列表项 1</li>
               <li>列表项 2</li>
             </ul>

             有序列表：
             <ol>
               <li>第一步</li>
               <li>第二步</li>
             </ol>

             引用：
             <blockquote>引用文字</blockquote>

             代码行：
             <code>var x = 1;</code>

             代码块：
             <pre><code>function hello() {
               console.log("Hello");
             }</code></pre>

             图片：
             <img src="../assets/images/your-image.png" alt="图片说明">

             链接：
             <a href="目标链接">显示文字</a>
             ========================================== -->

        <p>这是文章的开头段落，简要介绍本文要讲的内容。</p>

        <h2>第一章</h2>
        <p>正文内容...</p>

        <h2>第二章</h2>
        <p>正文内容...</p>

        <blockquote>核心要点总结或补充说明。</blockquote>

        <h2>总结</h2>
        <p>收尾总结...</p>

      </div>
    </article>
  </div>

  <footer class="site-footer">
    <!-- ===== [可选] 修改版权信息 ===== -->
    <p>&copy; 2026 我的文章</p>
  </footer>

  <!-- ===== 必要脚本，放在 </body> 前 ===== -->
  <script src="../assets/js/nav.js"></script>
</body>
</html>
