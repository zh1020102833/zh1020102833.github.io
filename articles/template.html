<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== [必改] 文章标题 ===== -->
  <title>文章标题</title>
  <!-- ===== [必改] 页面描述，用于 SEO 和社交分享（与 article-data.js 的 summary 保持一致） ===== -->
  <meta name="description" content="文章简短描述，建议 30-80 字">
  <!-- ===== [必改] 分类和日期（scan-articles.py 自动读取这些标签） ===== -->
  <meta name="category" content="分类名">
  <meta name="date" content="2026-05-22">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- ==========================================
       导航栏由 nav.js 自动生成，无需手动编写
       ========================================== -->

  <div class="main-wrapper">
    <!-- 返回首页链接 -->
    <a href="../index.html" class="back-link">&larr; 返回首页</a>

    <article class="article-detail">
      <header class="article-header">
        <!-- ===== [必改] 文章标题 ===== -->
        <h1>文章标题</h1>
        <div class="meta">
          <!-- ===== [必改] 分类和时间 ===== -->
          <span>分类：大类名称</span> &middot;
          <span>2026-05-22</span>
        </div>
      </header>

      <div class="article-body">
        <!-- ==========================================
             从此处开始写文章内容
             常用标签参考（复制后删除注释）：
             ==========================================

             段落：
             <p>文字内容</p>

             二级标题：
             <h2>标题文字</h2>

             三级标题：
             <h3>标题文字</h3>

             无序列表：
             <ul>
               <li>列表项 1</li>
               <li>列表项 2</li>
             </ul>

             有序列表：
             <ol>
               <li>第一步</li>
               <li>第二步</li>
             </ol>

             引用：
             <blockquote>引用文字</blockquote>

             代码行：
             <code>var x = 1;</code>

             代码块：
             <pre><code>function hello() {
               console.log("Hello");
             }</code></pre>

             图片：
             <img src="../assets/images/your-image.png" alt="图片说明">

             链接：
             <a href="目标链接">显示文字</a>
             ========================================== -->

        <p>这是文章的开头段落，简要介绍本文要讲的内容。</p>

        <h2>第一章</h2>
        <p>正文内容...</p>

        <h2>第二章</h2>
        <p>正文内容...</p>

        <blockquote>核心要点总结或补充说明。</blockquote>

        <h2>总结</h2>
        <p>收尾总结...</p>

      </div>
    </article>
  </div>

  <footer class="site-footer">
    <!-- ===== [可选] 修改版权信息 ===== -->
    <p>&copy; 2026 我的文章</p>
  </footer>

  <!-- ===== 必要脚本，放在 </body> 前 ===== -->
  <script src="../assets/js/nav.js"></script>

  <!--
  ════════════════════════════════════════════════════════════════
  加密发布流程（Staticrypt AES-256 + Remember Me 跨页面共享）
  ════════════════════════════════════════════════════════════════

  前置条件（仅首次）：
    npm install -g staticrypt

  ═══ 发布流程（每次新增/修改文章后执行） ═══

  1. 写完文章（保证 meta 标签完整：title / description / category / date）

  2. 重新扫描索引：
     python scripts/scan-articles.py
     （扫描 articles/ 明文源文件提取 meta，自动生成加密版路径指向 encrypted/）

  3. 加密文章（记住：密码 ≥ 14 位，--remember 0 实现单次登录全站共享）：
     echo y | staticrypt 文章文件名.html \
       -p "你的强密码" \
       --remember 0 \
       --short \
       --template-title "加密文章" \
       --template-instructions "请输入密码查看" \
       --template-placeholder "输入密码" \
       --template-error "密码错误" \
       --template-button "解锁" \
       -d "encrypted/"

  4. 修复加密文件的显示样式（Staticrypt 默认暗绿背景 + 相对路径偏移）：
     - encrypted 文件中 <head> 内添加 <base href="/articles/">
     - <style> 内追加 .staticrypt-content { background: #ffffff !important; ... }

  5. Git 提交 & 推送：
     git add scripts/scan-articles.py assets/js/article-data.js index.html articles/encrypted/ articles/template.html
     git commit -m "更新文章：xxx"
     git push

  ═══ 设计说明 ═══

  - 加密算法：AES-256-CBC + PBKDF2 密钥派生 + 随机 IV
  - Remember Me：用户勾选后密码哈希存 localStorage，同域名下所有 encrypted/ 文章自动解密
  - 仓库仅含加密版（articles/*.html 已加入 .gitignore，模板除外）
  - 本地保留明文源文件便于编辑，scan-articles.py 仍从明文提取 meta
  - <base href="/articles/"> 修正 encrypted/ 子目录下的 CSS/JS/图片相对路径
  - 登出：URL 追加 #staticrypt_logout 清除本地记住的密码
  - .staticrypt.json 含盐值，提交到仓库确保同一密码加密结果一致（否则 Remember Me 失效）

  ═══ 安全告诫 ═══

  - 密码长度 ≥ 14 位（不然离线暴力破解可行）
  - 密码不要写进仓库（别用明文，环境变量或手动输入）
  ════════════════════════════════════════════════════════════════
  -->

</body>
</html>
