      <p>这是一个纯静态个人文章网站，基于 HTML + CSS + JavaScript 构建。</p>

      <h2>技术栈</h2>
      <ul>
        <li>前端：纯 HTML5、CSS3、JavaScript（无框架）</li>
        <li>部署：阿里云 OSS + CDN</li>
        <li>上传：ossutil 命令行工具</li>

      <ul>

        <li>结构清晰，易于维护和扩展</li>
      </ul>
