<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章归档 - 啊卓的技术笔记</title>
  <meta name="description" content="啊卓的技术笔记归档列表">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="main-wrapper">
    <div class="page-header">
      <h1>文章归档</h1>
      <p>所有文章按时间倒序排列</p>
    </div>

    <div class="archive-list" id="archive-container"></div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 啊卓的技术笔记 &nbsp;|&nbsp; 🐧 QQ: 1020102833</p>
  </footer>

  <script src="../assets/js/nav.js"></script>
  <script src="../assets/js/article-data.js"></script>
  <script>
    (function () {
      function init() {
        var container = document.getElementById('archive-container');
        if (!container || !window.articleData) return;

        // 按日期倒序排列
        var sorted = articleData.slice().sort(function (a, b) {
          return b.date.localeCompare(a.date);
        });

        if (sorted.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>暂无文章</p></div>';
          return;
        }

        var html = '';
        for (var i = 0; i < sorted.length; i++) {
          var item = sorted[i];
          html +=
            '<div class="archive-item">' +
            '<span class="archive-date">' + item.date + '</span>' +
            '<span class="archive-category">' + item.category + '</span>' +
            '<a href="../' + item.file + '">' + item.title + '</a>' +
            '</div>';
        }
        container.innerHTML = html;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
